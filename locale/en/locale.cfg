auto-hide-on=Auto-hide is on. Hover the drag handle to reveal TPU. Click to disable auto-hide.
reorder-select=Click these rates to select this slot for swapping.
reorder-cancel=Selected for swapping. Click again to cancel.
reorder-destination=Click to swap this slot with the selected slot.
reorder-empty=Move here
reorder-tooltip=__1__\n__2__
hide-action-buttons=Hide action buttons.
show-action-buttons=Show action buttons.
pause-updates=Pause automatic rate updates.
resume-updates=Rate updates are paused. Click to resume.
slot-type-item=Item
slot-type-fluid=Fluid
