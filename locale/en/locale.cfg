[mod-name]
tiny-production-ui=Tiny Production UI

[mod-description]
tiny-production-ui=This mod adds UI that lets you see you production rates for selected items while you play the game.

[shortcut-name]
tpu_btn_shortcut=Toggle Tiny Production UI

[controls]
tpu-toggle-window=Toggle Tiny Production UI window

[controls-description]
tpu-toggle-window=Open or close the Tiny Production UI window.

[tpu]
